name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - name: Web UI security + config wiring + figure provenance
        env:
          REQUIRE_SNAKEMAKE: "1"      # a missing snakemake must fail CI, not silently skip the wiring tests
        run: pytest -q
