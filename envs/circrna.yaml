name: ciriquant
channels:
  - conda-forge
  - bioconda
dependencies:
  # ── Python runtime ────────────────────────────────
  - python=3.9
  - pip

  # ── Workflow ──────────────────────────────────────
  - snakemake=7.32.4

  # ── Data acquisition ─────────────────────────────
  - sra-tools=3.0.7
  - pigz
  - aria2

  # ── QC ───────────────────────────────────────────
  - fastqc=0.12.1
  - fastp=0.23.4
  - multiqc=1.16

  # ── Alignment / circRNA ───────────────────────────
  - star=2.7.10b
  - bwa=0.7.17
  - hisat2=2.2.1
  - samtools=1.17
  - bedtools=2.31.0

  # ── circRNA tools ─────────────────────────────────
  - ciriquant=1.1.3

  # ── Python packages ───────────────────────────────
  - pandas=2.0.3
  - numpy=1.24.4
  - scipy
  - requests
  - pyyaml>=6.0
  - flask=3.0.0
  - pyliftover

  # ── R & Bioconductor ─────────────────────────────
  - r-base=4.3.1
  - bioconductor-edger>=3.40
  - bioconductor-deseq2>=1.40
  - bioconductor-limma
  - bioconductor-qvalue
  - r-dplyr
  - r-tidyr
  - r-ggplot2
  - r-pheatmap
  - r-rcolorbrewer
  - r-ggrepel
  - r-tibble
  - r-statmod

  # ── DCC circRNA tool (bioconda, not PyPI) ────────
  - dcc=0.5.0

  # ── pip packages ─────────────────────────────────
  - pip:
    - markdown==3.3.7
    - plotly==5.18.0
    - pysradb
