# NOTE (2026-10-03): this file is a human-readable statement of intent --
# which tools and approximate versions this environment is meant to
# contain -- not what actually builds the Docker image. A fresh conda/mamba
# solve of these exact pins (python=3.7.12 together with current star/
# samtools/r-base builds) against today's live conda-forge/bioconda index
# is infeasible: the shared C libraries those tools now link against
# (htslib/libcurl/openssl/krb5) have moved past what python 3.7 can use.
# The Dockerfile instead builds from containers/spec-file.linux-64.txt (a
# `conda list --explicit` capture of the actual, already-running analysis
# server env) plus containers/pip-only-requirements.txt for the handful of
# pip-only packages -- see containers/build_notes.md for the full
# provenance and the pip-freeze.txt -> pip-only derivation. Keep this file
# in sync by eye when the server env changes, but treat the two files
# under containers/ as the authoritative, buildable record.
name: ciriquant
channels:
  - conda-forge
  - bioconda
dependencies:
  # ── Python runtime ────────────────────────────────
  # Pinned to match the server's verified execution environment (Table 1).
  - python=3.7.12
  - pip

  # ── Workflow ──────────────────────────────────────
  - snakemake=7.24.0

  # ── Data acquisition ─────────────────────────────
  - sra-tools=2.11.0
  - pigz=2.8
  - aria2=1.36.0

  # ── QC ───────────────────────────────────────────
  - fastqc=0.12.1
  - fastp=1.1.0
  - multiqc=1.13

  # ── Alignment / circRNA ───────────────────────────
  - star=2.7.11a
  - bwa=0.7.18
  - hisat2=2.2.1
  - samtools=1.18
  # bedtools: not in Table 1 (no verified version; grep confirms no script
  # in scripts/, workflow/, or benchmark/ actually invokes the bedtools
  # CLI) -- left unpinned rather than guessed. Candidate for removal;
  # not removed here since that's a separate decision from version-pinning.
  - bedtools

  # ── circRNA tools ─────────────────────────────────
  - ciriquant=1.1.3

  # ── Benchmark-only detectors (same conda env on the server per
  #    CLAUDE.md; used only by the reproduced CirComPara2/nf-core
  #    comparator strategies, never by the main circDEX pipeline) ──
  - circexplorer2=2.3.8
  - bowtie2=2.5.4

  # ── Python packages ───────────────────────────────
  # None of these appear in Table 1 (no verified version to match), and
  # python=3.7.12 is a much older constraint than python=3.9 was -- hard
  # pins copied from the old py3.9-era file risk being unsatisfiable
  # under py3.7 (pandas>=2.0, numpy 1.24.x, and recent plotly all require
  # python>=3.8). Left unpinned so conda's solver picks whatever is
  # actually compatible; a solver failure here is preferable to silently
  # resolving to an unverifiable version under a stale pin.
  - pandas
  - numpy
  - scipy
  - requests
  - pyyaml
  - flask=2.2.5
  - flask-wtf
  - pyliftover

  # ── R & Bioconductor ─────────────────────────────
  - r-base=4.2.1
  - bioconductor-edger=3.40.0
  - bioconductor-deseq2=1.38.0
  - bioconductor-limma=3.54.0
  - bioconductor-qvalue=2.30.0
  - r-dplyr
  - r-tidyr
  - r-ggplot2
  - r-pheatmap
  - r-rcolorbrewer
  - r-ggrepel
  - r-tibble
  - r-statmod=1.5.0

  # ── DCC circRNA tool (bioconda, not PyPI) ────────
  - dcc=0.5.0

  # ── pip packages ─────────────────────────────────
  # markdown MUST stay pinned at 3.3.7: under Python 3.7, multiqc fails to
  # import markdown>=3.6 (TypedDict) -- this is a known, previously-fixed
  # failure mode (see CLAUDE.md known-issues table), not a hypothetical.
  # plotly is intentionally left unpinned; not in Table 1, and the
  # verified 5.18.0 requires python>=3.8 so conda will resolve an older
  # version under py3.7.12 -- must verify post-build that generate_report.py
  # still produces an interactive report, not a static PDF fallback.
  - pip:
    - markdown==3.3.7
    - plotly
    - pysradb
