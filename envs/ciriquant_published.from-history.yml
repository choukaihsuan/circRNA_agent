# Intent record for the conda env that produced every published result
# (`ciriquant` on 172.16.0.178), corresponding to paper Table 3.
#
# This is the flattened result of 23 separate, hand-typed `conda install`
# commands run between 2025-08-14 and 2026-06-08 (recorded verbatim in
# $CONDA_PREFIX/conda-meta/history on the server) -- it records what was
# EXPLICITLY requested at each step, not the full resolved dependency
# graph. No environment.yml/lockfile was ever used to build this env; this
# file is a post-hoc reconstruction, generated by `conda env export
