<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline 執行狀態</title>
  <style>
    :root { --primary: #2563eb; --success: #16a34a; --error: #dc2626;
            --border: #e2e8f0; --bg: #f8fafc; --radius: 12px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: var(--bg); color: #1e293b; }
    .container { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .header h1 { font-size: 20px; font-weight: 700; }
    .back-link { font-size: 13px; color: var(--primary); text-decoration: none;
                 display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .back-link:hover { text-decoration: underline; }
    .status-card { background: white; border: 1px solid var(--border);
                   border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
    .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-run  { background: var(--primary); animation: pulse 1.2s ease-in-out infinite; }
    .dot-idle { background: var(--success); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .status-label { font-size: 15px; font-weight: 600; }
    .log-box { background: #0f172a; color: #94a3b8; border-radius: 8px;
               padding: 16px; font-family: "Courier New", monospace; font-size: 12px;
               line-height: 1.6; overflow-y: auto; max-height: 540px; white-space: pre-wrap;
               word-break: break-all; }
    .log-box .ok   { color: #4ade80; }
    .log-box .err  { color: #f87171; }
    .log-box .warn { color: #fbbf24; }
    .btn-row { display: flex; gap: 10px; margin-top: 16px; }
    .btn { padding: 9px 20px; border: none; border-radius: 8px; font-size: 13px;
           font-weight: 600; cursor: pointer; text-decoration: none;
           display: inline-flex; align-items: center; gap: 6px; }
    .btn-back   { background: #f1f5f9; color: #1e293b; }
    .btn-refresh{ background: var(--primary); color: white; }
    .auto-label { font-size: 12px; color: #64748b; margin-left: auto;
                  display: flex; align-items: center; gap: 6px; }
    input[type=checkbox] { accent-color: var(--primary); }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <span style="font-size:28px">📊</span>
    <h1>Pipeline 執行狀態</h1>
    <a href="/" class="back-link">← 回到設定</a>
  </div>

  <div class="status-card">
    <div class="status-row">
      <div class="dot {% if running %}dot-run{% else %}dot-idle{% endif %}" id="status-dot"></div>
      <span class="status-label" id="status-label">
        {% if running %}流程執行中…{% else %}流程閒置（未執行）{% endif %}
      </span>
    </div>
  </div>

  <div class="status-card">
    <div style="display:flex; align-items:center; margin-bottom:12px;">
      <span style="font-weight:700; font-size:15px;">執行 Log</span>
      <label class="auto-label">
        <input type="checkbox" id="auto-refresh" checked>
        每 5 秒自動更新
      </label>
    </div>
    <div class="log-box" id="log-box">{{ log }}</div>
  </div>

  <div class="btn-row">
    <a href="/" class="btn btn-back">← 回到設定</a>
    <button onclick="refreshLog()" class="btn btn-refresh">↻ 立即更新</button>
  </div>

</div>

<script>
  let timer = null;

  function colorizeLog(text) {
    return text
      .replace(/\b(Finished|finished|Completed|Success)\b/g, '<span class="ok">$1</span>')
      .replace(/\b(Error|error|ERROR|Failed|FAILED)\b/g, '<span class="err">$1</span>')
      .replace(/\b(Warning|WARNING|warning)\b/g, '<span class="warn">$1</span>');
  }

  async function refreshLog() {
    try {
      const res  = await fetch('/api/log');
      const data = await res.json();
      const box  = document.getElementById('log-box');
      box.innerHTML = colorizeLog(data.log);
      box.scrollTop = box.scrollHeight;

      const dot   = document.getElementById('status-dot');
      const label = document.getElementById('status-label');
      if (data.running) {
        dot.className   = 'dot dot-run';
        label.textContent = '流程執行中…';
      } else {
        dot.className   = 'dot dot-idle';
        label.textContent = '流程閒置（未執行）';
      }
    } catch (e) { /* ignore network errors */ }
  }

  function startTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(refreshLog, 5000);
  }

  document.getElementById('auto-refresh').addEventListener('change', e => {
    if (e.target.checked) startTimer();
    else { clearInterval(timer); timer = null; }
  });

  // Init
  document.getElementById('log-box').innerHTML =
    colorizeLog(document.getElementById('log-box').textContent);
  document.getElementById('log-box').scrollTop = 99999;
  startTimer();
</script>
</body>
</html>
