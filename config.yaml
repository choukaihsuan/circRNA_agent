ciriquant_config: config/ciriquant.yaml
use_container: false      # set true when running with --use-singularity
consensus:
  min_bsj_reads: 2
  min_tools: 2
  slop: 10
  max_junction_ratio: 1.0
  qc_bsj_threshold: 5       # only apply ratio QC when BSJ < this; high-BSJ circRNAs exempt
  tools:
  - ciriquant
  - dcc
de:
  method: edgeR_ciriquant
  fdr_cutoff: 0.05
  log2fc_cutoff: 1.0
  de_sig_by: auto            # auto = q<0.2 (Storey) then p<0.05; pvalue/padj = fixed
  fsj_concordance_lfc: 0.0  # min |logFC_fsj| for Type II concordance; 0=direction-only (recommended)
  isoform_fdr_cutoff: 0.1   # within-gene FDR for isoform switching (less strict than global)
  delta_iui_cutoff: 0.1     # minimum |ΔIUI| to call switching
  heatmap_top_n: 10         # top N up + N down circRNAs shown in heatmap
  interaction_top_n: 50    # top N circRNAs to query ENCORI for interactions
  encori_clip_exp_num: 1   # min CLIP experiments (1=all, 2=moderate, 3=high confidence)
  encori_program_num: 2    # min prediction programs agreeing
  normal_label: normal
  tumor_label: tumor
download:
  max_concurrent: 2
  retry: 3
  sra_cache_dir: /home/choukaihsuan/sra_cache
  tmp_dir: /home/choukaihsuan/sra_tmp
  ascp_speed: 500m
genome:
  bwa_index: /mnt/d/ref/hg19/bwa_index/hg19
  fasta: /mnt/d/ref/hg19/hg19.fa
  gtf: /mnt/d/ref/hg19/hg19.gtf
  hisat2_index: /mnt/d/ref/hg19/hisat2_index/hg19
  species: hg19
  star_index: /mnt/d/ref/hg19/star_index
circbase_file: ""   # leave empty for auto-download; or set local path
groups: metadata/sample_groups.csv
log_dir: logs
metadata: metadata/library_info.csv
project_id: GSE113230
raw_dir: /mnt/d/circRNA_data/raw_fastq
results_dir: /mnt/d/circRNA_results/GSE113230
threads: 8
trimmed_dir: /mnt/d/circRNA_data/trimmed
