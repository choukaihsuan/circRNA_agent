# /etc/nginx/conf.d/circdex.conf   (example; certificates via certbot or the campus CA)
limit_req_zone $binary_remote_addr zone=circdex_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=circdex_all:10m   rate=20r/s;

server {
    listen 80;
    server_name circdex.cgm.ntu.edu.tw;
    return 301 https://$host$request_uri;          # force HTTPS
}

server {
    listen 443 ssl http2;
    server_name circdex.cgm.ntu.edu.tw;

    ssl_certificate     /etc/letsencrypt/live/circdex.cgm.ntu.edu.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/circdex.cgm.ntu.edu.tw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;
    client_max_body_size 6m;                         # matches MAX_CONTENT_LENGTH (5 MB) + overhead

    location = /login {
        limit_req zone=circdex_login burst=5 nodelay;   # throttle magic-link requests
        include /etc/nginx/circdex_proxy.inc;
    }
    location / {
        limit_req zone=circdex_all burst=40 nodelay;
        include /etc/nginx/circdex_proxy.inc;
    }
}
