# ─────────────────────────────────────────────────────────────────────────────
# Config for Snakefile_multi — accuracy-only RNase R benchmark expansion
# (committee-requested 3rd and 4th RNase R +/- pairs, from PRJNA789110 /
# Vromman et al. 2023 Nat Methods, OncoRNALab).
#
# GSE55872 (the original ground truth dataset) is intentionally NOT listed
# here — its outputs already exist under benchmark/config_benchmark.yaml and
# must not be recomputed or touched. This config only drives the two NEW
# pairs; the three datasets are combined at the aggregation step in Stage 4.
# ─────────────────────────────────────────────────────────────────────────────

datasets:
  prjna789110_ncih23:
    total_rna: SRR17235469      # NCI-H23 (lung adenocarcinoma), untreated
    rnaser:
      - SRR17235466             # NCI-H23, RNase R-treated
    raw_dir:     /home3/choukaihsuan/benchmark_multi/prjna789110_ncih23/raw
    trimmed_dir: /home3/choukaihsuan/benchmark_multi/prjna789110_ncih23/trimmed
    results_dir: /home3/choukaihsuan/benchmark_multi/prjna789110_ncih23_results

  prjna789110_sw480:
    total_rna: SRR17235468      # SW480 (colorectal adenocarcinoma), untreated
    rnaser:
      - SRR17235465             # SW480, RNase R-treated
    raw_dir:     /home3/choukaihsuan/benchmark_multi/prjna789110_sw480/raw
    trimmed_dir: /home3/choukaihsuan/benchmark_multi/prjna789110_sw480/trimmed
    results_dir: /home3/choukaihsuan/benchmark_multi/prjna789110_sw480_results

# ── Reference genome (hg19) — identical to benchmark/config_benchmark.yaml ───
genome:
  fasta:         /home3/choukaihsuan/reference/hg19/hg19.fa
  gtf:           /home3/choukaihsuan/reference/hg19/genes.gtf
  bwa_index:     /home3/choukaihsuan/reference/hg19/hg19.fa
  hisat2_index:  /home3/choukaihsuan/reference/hg19/hisat2_index/hg19
  star_index:    /home3/choukaihsuan/reference/hg19/star_index
  bowtie2_index: /home3/choukaihsuan/reference/hg19/bowtie2_index/hg19
  ref_flat:      /home3/choukaihsuan/reference/hg19/refFlat.txt
  find_circ_dir: /home3/choukaihsuan/tools/find_circ
  ciri2_pl:      /home3/choukaihsuan/miniconda3/envs/ciriquant/lib/python3.7/site-packages/libs/CIRI2.pl

ciriquant_config: /home3/choukaihsuan/circRNA_agent/config/ciriquant.yaml

# ── Benchmark thresholds — IDENTICAL to benchmark/config_benchmark.yaml ──────
# (per instructions: settings must not be tuned differently per dataset)
benchmark:
  slop:               10
  min_bsj:            2
  max_junction_ratio: 1.0
  er_tp_threshold:    1.5
  er_tn_threshold:    0.5

threads: 8
