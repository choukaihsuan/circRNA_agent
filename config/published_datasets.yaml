    reason: "Esophageal squamous cell carcinoma, 6 paired tumor/normal"
  - accession: GSE248612
    reason: "Gastric cancer, 6 paired tumor/normal"
  - accession: GSE221107
    reason: "Prostate cancer, 4 paired tumor/normal (kept despite 0.2% single-tool ratio; see audit/thesis_dataset_table_19ds.tsv)"
  - accession: PRJNA553289
    reason: "Small cell lung cancer, 6 paired tumor/normal (Nanjing Chest Hospital)"
  - accession: GSE148036
    reason: "Lung adenocarcinoma, 5 vs. 5, unpaired design"
  - accession: GSE121842
